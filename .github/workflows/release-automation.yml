name: release-automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from dcg-cli Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/dcg-cli/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::Unable to parse version from crates/dcg-cli/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read latest tag
        id: latest
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.latest.outputs.latest != format('v{0}', steps.version.outputs.version)
        id: create_tag
        run: |
          tag="v${{ steps.version.outputs.version }}"
          echo "Creating release tag $tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Trigger dist workflow
        if: steps.create_tag.outputs.tag != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = "${{ steps.create_tag.outputs.tag }}";
            console.log(`Triggering dist workflow for tag ${tag}...`);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'dist.yml',
              ref: 'main',
              inputs: {
                tag: tag
              }
            });
            console.log('dist workflow triggered');

      - name: Skip (already tagged)
        if: steps.latest.outputs.latest == format('v{0}', steps.version.outputs.version)
        run: |
          echo "Latest tag matches Cargo.toml version; nothing to do."
